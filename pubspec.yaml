name: slovo_v_shlyape
description: Мобильная командная игра «Слово в шляпе».
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#120C26"
  image: "assets/icon/app_icon.jpg"
  android_12:
    image: "assets/icon/app_icon.jpg"
    color: "#120C26"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
